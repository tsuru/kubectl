name: ci
on: [push, pull_request]
jobs:
  generate-kubectl-versions-matrix:
    name: "Setes up all kubectl release versions for further build and push"
    runs-on: ubuntu-latest
    outputs:
      kubectl-versions: ${{ steps. kubectl-version-setup.outputs.items }}

    steps:
      - name: Fetch all kubectl versions from minors
        id: kubectl-version-setup
        env:
          KUBECTL_MINORS: "1.34,1.35,1.36"
        run: |
          KUBECTL_VERSIONS=()

          for minor in ${KUBECTL_MINORS//,/ }; do
            echo "Fetching kubectl versions with $minor"
            mapfile -t KUBECTL_MINOR_VERSIONS < <(
              git ls-remote --tags https://github.com/kubernetes/kubectl |
                awk -F'/' '{print $3}' |
                grep -E "kubernetes-$minor.[0-9]+$" |
                awk -F'-' '{print "v"$2}' |
                sort -V
            )
            for minor_version in "${KUBECTL_MINOR_VERSIONS[@]}"; do
              KUBECTL_VERSIONS+=("$minor_version")
            done
          done

          echo "All kubectl versions"
          printf '%s\n' "${KUBECTL_VERSIONS[@]}"

          KUBECTL_VERSIONS_JSON_ARRAY=$(jq -n -c '$ARGS.positional' --args "${KUBECTL_VERSIONS[@]}")

          echo "items=$KUBECTL_VERSIONS_JSON_ARRAY" > $GITHUB_OUTPUT

  image:
    needs: generate-kubectl-versions-matrix
    name: "Publish kubectl image on Docker Hub"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kubectl: ${{ fromJson(needs.generate-kubectl-versions-matrix.outputs.kubectl-versions) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Set Docker tags
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo DOCKER_TAGS=tsuru/kubectl:${{ matrix.kubectl }},tsuru/kubectl:${{ matrix.kubectl }}-${GITHUB_REF##*/},tsuru/kubectl:latest >> $GITHUB_ENV
          else
            echo DOCKER_TAGS=tsuru/kubectl:${{ matrix.kubectl }}-${GITHUB_REF##*/} >> $GITHUB_ENV
          fi
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: docker/build-push-action@v7
        if: github.event_name != 'pull_request'
        with:
          push: true
          tags: ${{ env.DOCKER_TAGS }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
          platforms: linux/amd64,linux/arm64
          build-args: |
            KUBECTL_RELEASE=${{ matrix.kubectl }}
